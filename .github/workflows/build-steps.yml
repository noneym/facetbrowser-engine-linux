name: Building Linux AppImage for ungoogled-chromium

defaults:
  run:
    shell: bash

on:
  workflow_call:
    inputs:
      arch:
        required: true
        type: string
      runs-on:
        required: true
        type: string
      resume_run_id:
        required: false
        type: string
        default: ''
      engine_ref:
        required: false
        type: string
        default: ''
      preflight_only:
        required: false
        type: boolean
        default: false

env:
  ARCH: ${{ inputs.arch }}
  ENGINE_REF: ${{ inputs.engine_ref }}
  FACET_PREFLIGHT_ONLY: ${{ inputs.preflight_only }}

jobs:
  prep:
    name: Prepare resources
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with: { submodules: true }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and cache Docker image
        id: build-image
        uses: docker/build-push-action@v5
        with:
          context: ./docker
          file: ./docker/build.Dockerfile
          tags: chromium-builder:trixie-slim
          outputs: type=docker,dest=/tmp/chromium-builder.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-${{ inputs.arch }}
          path: /tmp/chromium-builder.tar
          retention-days: 1

      - name: Prepare build tree
        if: ${{ inputs.resume_run_id == '' }}
        uses: ./.github/actions/build
        with:
          prepare-only: true
          use-existing-image: true

      # Continuing: the build cache of the other run becomes this run's
      - name: Download the build cache of the run to continue
        if: ${{ inputs.resume_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: build-cache-${{ inputs.arch }}
          path: .github/cache/
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ github.token }}

      - name: Hand the build cache to this run
        if: ${{ inputs.resume_run_id != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: build-cache-${{ inputs.arch }}
          path: .github/cache/build-cache-${{ inputs.arch }}.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 5

  build_part_01:
    runs-on: ${{ inputs.runs-on }}
    needs: prep
    outputs:
      status: ${{ steps.build.outputs.status }}
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }
      - uses: ./.github/actions/build
        id: build
        with: { use-existing-image: true }

  build_part_02:
    runs-on: ${{ inputs.runs-on }}
    if: needs.build_part_01.outputs.status == 'running'
    needs: build_part_01
    outputs:
      status: ${{ steps.build.outputs.status }}
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }
      - uses: ./.github/actions/build
        id: build
        with: { use-existing-image: true }

  build_part_03:
    runs-on: ${{ inputs.runs-on }}
    if: needs.build_part_02.outputs.status == 'running'
    needs: build_part_02
    outputs:
      status: ${{ steps.build.outputs.status }}
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }
      - uses: ./.github/actions/build
        id: build
        with: { use-existing-image: true }

  build_part_04:
    runs-on: ${{ inputs.runs-on }}
    if: needs.build_part_03.outputs.status == 'running'
    needs: build_part_03
    outputs:
      status: ${{ steps.build.outputs.status }}
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }
      - uses: ./.github/actions/build
        id: build
        with: { use-existing-image: true }

  build_part_05:
    runs-on: ${{ inputs.runs-on }}
    if: needs.build_part_04.outputs.status == 'running'
    needs: build_part_04
    outputs:
      status: ${{ steps.build.outputs.status }}
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }
      - uses: ./.github/actions/build
        id: build
        with: { use-existing-image: true }

  build_part_06:
    runs-on: ${{ inputs.runs-on }}
    if: needs.build_part_05.outputs.status == 'running'
    needs: build_part_05
    outputs:
      status: ${{ steps.build.outputs.status }}
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }
      - uses: ./.github/actions/build
        id: build
        with: { use-existing-image: true }

  build_part_07:
    runs-on: ${{ inputs.runs-on }}
    if: needs.build_part_06.outputs.status == 'running'
    needs: build_part_06
    outputs:
      status: ${{ steps.build.outputs.status }}
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }
      - uses: ./.github/actions/build
        id: build
        with: { use-existing-image: true }

  build_part_08:
    runs-on: ${{ inputs.runs-on }}
    if: needs.build_part_07.outputs.status == 'running'
    needs: build_part_07
    outputs:
      status: ${{ steps.build.outputs.status }}
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }
      - uses: ./.github/actions/build
        id: build
        with: { use-existing-image: true }

  build_part_09:
    runs-on: ${{ inputs.runs-on }}
    if: needs.build_part_08.outputs.status == 'running'
    needs: build_part_08
    outputs:
      status: ${{ steps.build.outputs.status }}
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }
      - uses: ./.github/actions/build
        id: build
        with: { use-existing-image: true }

  build_part_10:
    runs-on: ${{ inputs.runs-on }}
    if: needs.build_part_09.outputs.status == 'running'
    needs: build_part_09
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }
      - uses: ./.github/actions/build
        with: { use-existing-image: true, final: true }

  package:
    runs-on: ${{ inputs.runs-on }}
    if: ${{ !cancelled() && !failure() && !inputs.preflight_only
            && contains(fromJSON('["success", "skipped"]'),
                        needs.build_part_10.result) }}
    needs: build_part_10
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }
      - uses: ./.github/actions/package

  test:
    name: Test the tar.xz
    if: ${{ !cancelled() && needs.package.result == 'success' }}
    needs: package
    uses: ./.github/workflows/test.yml
