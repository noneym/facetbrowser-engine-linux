name: Test a Linux build of FacetBrowser Engine
run-name: Test the tar.xz of run ${{ inputs.run_id }}
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Run id of the build whose tar.xz is tested
        type: string
        required: true
  workflow_call:
    inputs:
      run_id:
        description: Run id of the build whose tar.xz is tested; empty for the calling run
        type: string
        required: false
        default: ''

permissions:
  contents: read
  # To download the tar.xz of another run
  actions: read

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Run on Debian bookworm
    runs-on: ubuntu-latest
    container:
      # The first consumer runs the engine headless in a Debian bookworm image
      image: node:22-bookworm-slim
    steps:
      - name: Install the libraries the consumer's image has
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git xz-utils binutils \
            libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdbus-1-3 libdrm2 libxkbcommon0 \
            libatspi2.0-0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libpango-1.0-0 \
            libcairo2 libasound2 libx11-xcb1 libfontconfig1 libx11-6 libxcb1 libxext6 libxshmfence1 \
            libglib2.0-0 fonts-liberation fonts-noto-core fonts-noto-color-emoji fonts-freefont-ttf

      - name: Clone repository
        uses: actions/checkout@v4

      - name: Download the tar.xz
        uses: actions/download-artifact@v4
        with:
          pattern: ungoogled-chromium-*-linux
          merge-multiple: true
          path: download
          run-id: ${{ inputs.run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Unpack
        run: |
          ls -la download
          sha256sum download/*.tar.xz | tee results.txt
          mkdir engine
          tar -xJf download/*.tar.xz -C engine --strip-components=1
          ls -la engine

      - name: Shared libraries and glibc
        run: |
          for file in chrome chromedriver chrome_crashpad_handler; do
            echo "== $file" | tee -a results.txt
            ldd "engine/$file" | tee -a ldd.txt
            echo "newest glibc symbol: $(objdump -T "engine/$file" | grep -o 'GLIBC_[0-9.]*' | sort -V | tail -n 1)" | tee -a results.txt
          done
          echo "glibc of this image: $(ldd --version | head -n 1)" | tee -a results.txt
          if grep "not found" ldd.txt; then
            echo "a shared library is missing" | tee -a results.txt
            exit 1
          fi

      - name: Versions
        run: |
          engine/chrome --version | tee -a results.txt
          engine/chromedriver --version | tee -a results.txt
          echo "cdc_ strings in chromedriver: $(grep -ac 'cdc_' engine/chromedriver || true)" | tee -a results.txt

      - name: chromedriver session
        run: node .github/scripts/chromedriver_smoke.mjs "$PWD/engine/chrome" "$PWD/engine/chromedriver" | tee -a results.txt

      - name: Fingerprint probe
        run: |
          curl -fsSL -o probe.mjs https://raw.githubusercontent.com/noneym/facetbrowser-engine/main/facet/fingerprint_probe.mjs
          set -- --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu
          node probe.mjs run --exe "$PWD/engine/chrome" --platform linux --seed 1000 --stress 50 --out seed1000-a.json -- "$@"
          node probe.mjs run --exe "$PWD/engine/chrome" --platform linux --seed 1000 --out seed1000-b.json -- "$@"
          node probe.mjs run --exe "$PWD/engine/chrome" --platform linux --seed 2000 --out seed2000.json -- "$@"
          node probe.mjs run --exe "$PWD/engine/chrome" --no-fingerprint --out plain.json -- "$@"
          echo "== same seed twice" | tee -a results.txt
          node probe.mjs diff seed1000-a.json seed1000-b.json | tee -a results.txt || true
          echo "== seed 1000 against seed 2000" | tee -a results.txt
          node probe.mjs diff seed1000-a.json seed2000.json | tee -a results.txt || true
          echo "== seed 1000 against no fingerprint switches" | tee -a results.txt
          node probe.mjs diff seed1000-a.json plain.json | tee -a results.txt || true

      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            results.txt
            ldd.txt
            *.json
          if-no-files-found: warn
